<div class="hub">

  <nav class="hub-tabs" aria-label="Araçlar">
    @for (tab of tabs; track tab.key) {
      <button
        type="button"
        class="hub-tab"
        [class.active]="active() === tab.key"
        [attr.aria-current]="active() === tab.key ? 'page' : null"
        (click)="select(tab.key)">
        {{ tab.label }}
      </button>
    }
  </nav>

  <div class="hub-body">
    @switch (active()) {
      @case ('catalog') { <app-catalog-import [embedded]="true" /> }
      @default { <app-vehicle [embedded]="true" /> }
    }
  </div>

</div>
