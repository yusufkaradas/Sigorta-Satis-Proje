<div class="kf-page">

  <div class="kf-title">
    MÜŞTERİ DÜZENLE
  </div>

  <form
    class="kf-panel"
    (ngSubmit)="submit()">

    <div class="kf-panel-head">
      <div>
        <h1>{{ form.firstName }} {{ form.lastName }}</h1>
        <p>Müşteri bilgilerini güncelleyin.</p>
      </div>
      <a [routerLink]="['/customers', customerId]" class="kf-btn-outline">← Detaya Dön</a>
    </div>

    <div *ngIf="errorMessage" class="kf-alert kf-alert-error">{{ errorMessage }}</div>

    <div *ngIf="successMessage" class="kf-alert kf-alert-success">{{ successMessage }}</div>

    <div *ngIf="isLoading" class="kf-state">Müşteri yükleniyor...</div>

    <div *ngIf="!isLoading" class="kf-body kf-body-half">

      <section class="kf-section">

        <h2 class="kf-section-title">Kişisel Bilgiler</h2>

        <div class="kf-grid">

          <div class="kf-field">
            <label for="firstName">Ad *</label>
            <input appInputRule="name" [ruleMaxLength]="25" maxlength="25" id="firstName" type="text" name="firstName" [(ngModel)]="form.firstName" />
          </div>

          <div class="kf-field">
            <label for="lastName">Soyad *</label>
            <input appInputRule="name" [ruleMaxLength]="25" maxlength="25" id="lastName" type="text" name="lastName" [(ngModel)]="form.lastName" />
          </div>

          <div class="kf-field">
            <label for="identityNumber">T.C. Kimlik No *</label>
            <input appInputRule="digits" [ruleMaxLength]="11" id="identityNumber" type="text" inputmode="numeric" maxlength="11" name="identityNumber" [(ngModel)]="form.identityNumber" />
          </div>

          <div class="kf-field">
            <label for="dateOfBirth">Doğum Tarihi *</label>
            <input [min]="minBirthDate" [max]="maxBirthDate" id="dateOfBirth" type="date" name="dateOfBirth" [(ngModel)]="form.dateOfBirth" />
          </div>

          <div class="kf-field kf-span-all">
            <label class="kf-check">
              <input type="checkbox" name="isActive" [(ngModel)]="form.isActive" />
              Müşteri aktif
            </label>
          </div>

        </div>

      </section>

      <section class="kf-section">

        <h2 class="kf-section-title">İletişim ve Adres</h2>

        <div class="kf-grid">

          <div class="kf-field">
            <label for="email">E-posta *</label>
            <input appInputRule="email" [ruleMaxLength]="150" maxlength="150" id="email" type="email" name="email" [(ngModel)]="form.email" />
          </div>

          <div class="kf-field">
            <label for="phoneNumber">Telefon *</label>
            <input appInputRule="phone" [ruleMaxLength]="10" maxlength="10" id="phoneNumber" type="tel" name="phoneNumber" [(ngModel)]="form.phoneNumber" />
          </div>

          <div class="kf-field">
            <label for="city">Şehir *</label>
            <input appInputRule="place" [ruleMaxLength]="50" maxlength="50" id="city" type="text" name="city" [(ngModel)]="form.city" />
          </div>

          <div class="kf-field">
            <label for="district">İlçe *</label>
            <input appInputRule="place" [ruleMaxLength]="50" maxlength="50" id="district" type="text" name="district" [(ngModel)]="form.district" />
          </div>

          <div class="kf-field kf-span-all">
            <label for="address">Adres</label>
            <textarea appInputRule="address" [ruleMaxLength]="100" maxlength="100" id="address" rows="2" name="address" [(ngModel)]="form.address"></textarea>
          </div>

        </div>

      </section>

    </div>

    <div class="kf-actions">
      <a [routerLink]="['/customers', customerId]" class="kf-btn-outline">İptal</a>
      <button type="submit" class="kf-btn" [disabled]="isSubmitting || isLoading">
        {{ isSubmitting ? 'Kaydediliyor...' : 'Değişiklikleri Kaydet' }}
      </button>
    </div>

  </form>

</div>
