<div class="kf-page">

  <div class="kf-title">
    YENİ MÜŞTERİ
  </div>

  <form
    class="kf-panel"
    (ngSubmit)="submit()">

    <div class="kf-panel-head">
      <div>
        <h1>Müşteri Ekle</h1>
        <p>Yeni müşterinin kimlik, iletişim ve adres bilgilerini girin.</p>
      </div>
      <a routerLink="/customers" class="kf-btn-outline">← Müşterilere Dön</a>
    </div>

    <div *ngIf="errorMessage" class="kf-alert kf-alert-error">{{ errorMessage }}</div>

    <div *ngIf="successMessage" class="kf-alert kf-alert-success">{{ successMessage }}</div>

    <div class="kf-body kf-body-half">

      <section class="kf-section">

        <h2 class="kf-section-title">Kişisel Bilgiler</h2>

        <div class="kf-grid">

          <div class="kf-field">
            <label for="firstName">Ad *</label>
            <input id="firstName" type="text" name="firstName" [(ngModel)]="form.firstName" placeholder="Ad" />
          </div>

          <div class="kf-field">
            <label for="lastName">Soyad *</label>
            <input id="lastName" type="text" name="lastName" [(ngModel)]="form.lastName" placeholder="Soyad" />
          </div>

          <div class="kf-field">
            <label for="identityNumber">T.C. Kimlik No *</label>
            <input id="identityNumber" type="text" inputmode="numeric" maxlength="11" name="identityNumber" [(ngModel)]="form.identityNumber" placeholder="11 haneli" />
          </div>

          <div class="kf-field">
            <label for="dateOfBirth">Doğum Tarihi *</label>
            <input id="dateOfBirth" type="date" name="dateOfBirth" [(ngModel)]="form.dateOfBirth" />
          </div>

        </div>

      </section>

      <section class="kf-section">

        <h2 class="kf-section-title">İletişim ve Adres</h2>

        <div class="kf-grid">

          <div class="kf-field">
            <label for="email">E-posta *</label>
            <input id="email" type="email" name="email" [(ngModel)]="form.email" placeholder="ornek@eposta.com" />
          </div>

          <div class="kf-field">
            <label for="phoneNumber">Telefon *</label>
            <input id="phoneNumber" type="tel" name="phoneNumber" [(ngModel)]="form.phoneNumber" placeholder="5XX XXX XX XX" />
          </div>

          <div class="kf-field">
            <label for="city">Şehir *</label>
            <input id="city" type="text" name="city" [(ngModel)]="form.city" placeholder="Şehir" />
          </div>

          <div class="kf-field">
            <label for="district">İlçe *</label>
            <input id="district" type="text" name="district" [(ngModel)]="form.district" placeholder="İlçe" />
          </div>

          <div class="kf-field kf-span-all">
            <label for="address">Adres</label>
            <textarea id="address" rows="2" name="address" [(ngModel)]="form.address" placeholder="Açık adres"></textarea>
          </div>

        </div>

      </section>

    </div>

    <div class="kf-actions">
      <a routerLink="/customers" class="kf-btn-outline">İptal</a>
      <button type="submit" class="kf-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Kaydediliyor...' : 'Müşteriyi Kaydet' }}
      </button>
    </div>

  </form>

</div>
