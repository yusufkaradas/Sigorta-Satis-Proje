<div class="kf-page">

  <div class="kf-title">
    KULLANICI DÜZENLE
  </div>

  <form
    class="kf-panel"
    (ngSubmit)="save()"
    #userForm="ngForm">

    <div class="kf-panel-head">
      <div>
        <h1>{{ model.firstName }} {{ model.lastName }}</h1>
        <p>Kullanıcının bilgilerini, rolünü ve durumunu güncelleyin.</p>
      </div>
      <button type="button" class="kf-btn-outline" (click)="cancel()">← Kullanıcılara Dön</button>
    </div>

    <div *ngIf="errorMessage" class="kf-alert kf-alert-error">{{ errorMessage }}</div>

    <div *ngIf="isLoading" class="kf-state">Kullanıcı yükleniyor...</div>

    <div *ngIf="!isLoading" class="kf-body kf-body-half">

      <section class="kf-section">

        <h2 class="kf-section-title">Kişisel Bilgiler</h2>

        <div class="kf-grid">

          <div class="kf-field">
            <label for="firstName">Ad *</label>
            <input id="firstName" type="text" name="firstName" [(ngModel)]="model.firstName" required />
          </div>

          <div class="kf-field">
            <label for="lastName">Soyad *</label>
            <input id="lastName" type="text" name="lastName" [(ngModel)]="model.lastName" required />
          </div>

          <div class="kf-field kf-span-all">
            <label for="phoneNumber">Telefon</label>
            <input id="phoneNumber" type="tel" name="phoneNumber" [(ngModel)]="model.phoneNumber" />
          </div>

        </div>

      </section>

      <section class="kf-section">

        <h2 class="kf-section-title">Hesap Bilgileri</h2>

        <div class="kf-grid">

          <div class="kf-field kf-span-all">
            <label for="email">E-posta *</label>
            <input id="email" type="email" name="email" [(ngModel)]="model.email" required />
          </div>

          <div class="kf-field">
            <label for="roleId">Rol *</label>
            <select id="roleId" name="roleId" [(ngModel)]="model.roleId" required>
              <option value="" disabled>Rol seçin</option>
              <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
            </select>
          </div>

          <div class="kf-field">
            <label for="isActive">Durum</label>
            <select id="isActive" name="isActive" [(ngModel)]="model.isActive">
              <option [ngValue]="true">Aktif</option>
              <option [ngValue]="false">Pasif</option>
            </select>
          </div>

        </div>

      </section>

    </div>

    <div class="kf-actions">
      <button type="button" class="kf-btn-outline" (click)="cancel()">İptal</button>
      <button type="submit" class="kf-btn" [disabled]="userForm.invalid || isSaving || isLoading">
        {{ isSaving ? 'Kaydediliyor...' : 'Değişiklikleri Kaydet' }}
      </button>
    </div>

  </form>

</div>
