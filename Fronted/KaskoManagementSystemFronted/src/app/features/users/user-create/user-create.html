<div class="user-create-page">

  <section class="page-header">

    <div>

      <h1>
        Yeni Kullanıcı
      </h1>

      <p>
        Sisteme yeni kullanıcı ekle
      </p>

    </div>

  </section>


  <section class="form-card">

    <div
      *ngIf="errorMessage"
      class="error-message">

      {{ errorMessage }}

    </div>


    <form
      (ngSubmit)="save()"
      #userForm="ngForm">


      <div class="form-grid">


        <div class="form-group">

          <label>
            Ad
          </label>

          <input
            type="text"
            name="firstName"
            [(ngModel)]="model.firstName"
            required>

        </div>


        <div class="form-group">

          <label>
            Soyad
          </label>

          <input
            type="text"
            name="lastName"
            [(ngModel)]="model.lastName"
            required>

        </div>


        <div class="form-group">

          <label>
            E-posta
          </label>

          <input
            type="email"
            name="email"
            [(ngModel)]="model.email"
            required>

        </div>


        <div class="form-group">

          <label>
            Telefon
          </label>

          <input
            type="text"
            name="phoneNumber"
            [(ngModel)]="model.phoneNumber">

        </div>


        <div class="form-group">

          <label>
            Şifre
          </label>

          <input
            type="password"
            name="password"
            [(ngModel)]="model.password"
            required>

        </div>


        <div class="form-group">

          <label>
            Rol ID
          </label>

          <input
            type="text"
            name="roleId"
            [(ngModel)]="model.roleId"
            required>

        </div>


      </div>


      <div class="form-actions">

        <button
          type="button"
          class="cancel-button"
          (click)="cancel()">

          İptal

        </button>


        <button
          type="submit"
          class="save-button"
          [disabled]="userForm.invalid || isLoading">

          {{ isLoading ? 'Kaydediliyor...' : 'Kaydet' }}

        </button>

      </div>


    </form>

  </section>

</div>
