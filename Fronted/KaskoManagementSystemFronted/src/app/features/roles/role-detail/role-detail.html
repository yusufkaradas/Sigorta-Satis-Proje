<div class="kf-page">

  <div class="kf-title">
    ROL DETAYI
  </div>

  <section class="kf-panel">

    <div class="kf-panel-head">
      <div>
        <h1>
          {{ role?.name || 'Rol Detayı' }}
          <span *ngIf="role" class="kf-badge active">Aktif</span>
        </h1>
        <p>Rol bilgilerini görüntüleyin.</p>
      </div>
      <button type="button" class="kf-btn-outline" (click)="goBack()">Rollere Dön</button>
    </div>

    <div *ngIf="isLoading" class="kf-state">Rol bilgileri yükleniyor...</div>

    <div *ngIf="!isLoading && errorMessage" class="kf-state">{{ errorMessage }}</div>

    <div *ngIf="!isLoading && role" class="kf-body kf-body-center">

      <section class="kf-section kf-narrow">
        <h2 class="kf-section-title">Rol Bilgileri</h2>
        <dl class="kf-details kf-details-1">
          <div><dt>Rol Adı</dt><dd>{{ role.name }}</dd></div>
          <div><dt>Rol ID</dt><dd [title]="role.id">{{ role.id }}</dd></div>
        </dl>
      </section>

    </div>

    <div class="kf-actions kf-actions-between">
      <button type="button" class="kf-btn-outline" (click)="goBack()">Geri Dön</button>
      <div *ngIf="role" class="kf-head-actions">
        <button type="button" class="kf-btn-danger" (click)="deleteRole()">Rolü Sil</button>
        <a [routerLink]="['/roles', role.id, 'edit']" class="kf-btn">Düzenle</a>
      </div>
    </div>

  </section>

</div>
