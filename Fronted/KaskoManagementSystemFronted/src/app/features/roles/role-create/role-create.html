<div class="kf-page">

  <div class="kf-title">
    YENİ ROL
  </div>

  <form
    class="kf-panel"
    (ngSubmit)="onSubmit()">

    <div class="kf-panel-head">
      <div>
        <h1>Rol Ekle</h1>
        <p>Kullanıcılara atanabilecek yeni bir rol tanımlayın.</p>
      </div>
      <button type="button" class="kf-btn-outline" (click)="goBack()" [disabled]="isLoading">← Rollere Dön</button>
    </div>

    @if (errorMessage) {
      <div class="kf-alert kf-alert-error">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="kf-alert kf-alert-success">{{ successMessage }}</div>
    }

    <div class="kf-body kf-body-center">

      <section class="kf-section kf-narrow">

        <h2 class="kf-section-title">Rol Bilgisi</h2>

        <div class="kf-field">
          <label for="roleName">Rol Adı *</label>
          <input id="roleName" name="roleName" type="text" placeholder="Örn. Manager" [(ngModel)]="name" [disabled]="isLoading" />
          <small>Sistemde tanımlı roller: Admin, Manager, Customer.</small>
        </div>

      </section>

    </div>

    <div class="kf-actions">
      <button type="button" class="kf-btn-outline" (click)="goBack()" [disabled]="isLoading">Vazgeç</button>
      <button type="submit" class="kf-btn" [disabled]="isLoading">
        {{ isLoading ? 'Oluşturuluyor...' : 'Rolü Kaydet' }}
      </button>
    </div>

  </form>

</div>
