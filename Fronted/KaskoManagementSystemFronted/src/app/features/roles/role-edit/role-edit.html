<div class="kf-page">

  <div class="kf-title">
    ROL DÜZENLE
  </div>

  <form
    class="kf-panel"
    (ngSubmit)="submit()"
    #roleForm="ngForm">

    <div class="kf-panel-head">
      <div>
        <h1>{{ form.name || 'Rol' }} Düzenle</h1>
        <p>Rol adını güncelleyin.</p>
      </div>
      <button type="button" class="kf-btn-outline" (click)="goBack()">Detaya Dön</button>
    </div>

    <div *ngIf="errorMessage" class="kf-alert kf-alert-error">{{ errorMessage }}</div>

    <div *ngIf="successMessage" class="kf-alert kf-alert-success">{{ successMessage }}</div>

    <div *ngIf="isLoading" class="kf-state">Rol bilgileri yükleniyor...</div>

    <div *ngIf="!isLoading" class="kf-body kf-body-center">

      <section class="kf-section kf-narrow">

        <h2 class="kf-section-title">Rol Bilgisi</h2>

        <div class="kf-field">
          <label for="roleName">Rol Adı *</label>
          <input id="roleName" type="text" name="name" [(ngModel)]="form.name" required maxlength="50" placeholder="Rol adını girin" />
        </div>

      </section>

    </div>

    <div class="kf-actions">
      <button type="button" class="kf-btn-outline" (click)="goBack()">İptal</button>
      <button type="submit" class="kf-btn" [disabled]="isSubmitting || isLoading || roleForm.invalid">
        {{ isSubmitting ? 'Kaydediliyor...' : 'Değişiklikleri Kaydet' }}
      </button>
    </div>

  </form>

</div>
