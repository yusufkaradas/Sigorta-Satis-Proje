<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-logo">
      <span>Logo</span>
    </div>


    <nav class="sidebar-menu">

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
      >
        Dashboard
      </a>

      <a
        routerLink="/customers"
        routerLinkActive="active"
        class="menu-item"
      >
        Müşteriler
      </a>

      <a
        routerLink="/vehicles"
        routerLinkActive="active"
        class="menu-item"
      >
        Araçlar
      </a>

      <a
        routerLink="/quotes"
        routerLinkActive="active"
        class="menu-item"
      >
        Teklifler
      </a>

      <a
        routerLink="/policies"
        routerLinkActive="active"
        class="menu-item"
      >
        Poliçeler
      </a>

      <a
        routerLink="/payments"
        routerLinkActive="active"
        class="menu-item"
      >
        Ödemeler
      </a>

      <a
        routerLink="/users"
        routerLinkActive="active"
        class="menu-item"
      >
        Kullanıcılar
      </a>

      <a
        routerLink="/roles"
        routerLinkActive="active"
        class="menu-item"
      >
        Roller
      </a>

    </nav>


    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      Çıkış
    </button>

  </aside>


  <!-- MAIN -->
  <main class="main-content">

    <header class="topbar">

      <div class="topbar-title">
        ADMİN PANELİ
      </div>


      <div class="topbar-actions">

        <button
          type="button"
          class="topbar-icon"
          aria-label="Ayarlar"
        >
        </button>

        <button
          type="button"
          class="topbar-icon"
          aria-label="Bildirimler"
        >
        </button>

        <button
          type="button"
          class="user-button"
        >
          KULLANICI ADI
        </button>

      </div>

    </header>


    <section class="content-area">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>
